<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceNet Enhanced Integration</title>
    <link rel="stylesheet" href="facenet_enhanced_styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }
        
        .header p {
            color: #7f8c8d;
            margin: 0;
            font-size: 1.1em;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 25px;
            border: 2px solid #e9ecef;
        }
        
        .control-group label {
            font-weight: 600;
            color: #495057;
        }
        
        .control-group input,
        .control-group select {
            padding: 5px 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .camera-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .camera-container {
            position: relative;
            display: inline-block;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        #video {
            width: 100%;
            max-width: 640px;
            height: auto;
            display: block;
        }
        
        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        
        .face-detection-box {
            position: absolute;
            border: 3px solid #00ff00;
            border-radius: 5px;
            background: rgba(0, 255, 0, 0.1);
            display: none;
        }
        
        .camera-controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            min-width: 120px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
        }
        
        .status.success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
        }
        
        .status.error {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }
        
        .status.info {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 2em;
        }
        
        .stat-card p {
            margin: 0;
            opacity: 0.9;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            position: relative;
            overflow: hidden;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="header">
            <h1>🔍 FaceNet Enhanced Recognition</h1>
            <p>Advanced facial feature analysis with detailed geometry and landmark detection</p>
        </div>
        
        <!-- Mode Indicator -->
        <div id="enhanced-mode-indicator" class="mode-indicator enhanced">
            Enhanced Mode: ON
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="threshold">Threshold:</label>
                <input type="range" id="threshold" min="0.1" max="2.0" step="0.1" value="1.0">
                <span id="threshold-value">1.0</span>
            </div>
            
            <div class="control-group">
                <label for="feature-analysis">Show Analysis:</label>
                <input type="checkbox" id="feature-analysis" checked>
            </div>
            
            <div class="control-group">
                <button class="btn btn-secondary" onclick="faceNetEnhanced.toggleEnhancedMode()">
                    Toggle Mode
                </button>
            </div>
        </div>
        
        <!-- Camera Section -->
        <div class="camera-section">
            <div class="camera-container">
                <video id="video" autoplay muted></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="camera-overlay">
                    <div id="face-detection-box" class="face-detection-box"></div>
                </div>
            </div>
            
            <div class="camera-controls">
                <button id="start-camera" class="btn btn-primary">📷 Start Camera</button>
                <button id="stop-camera" class="btn btn-secondary" disabled>⏹️ Stop Camera</button>
                <button id="capture-photo" class="btn btn-success" disabled>📸 Capture Photo</button>
                <button id="process-attendance" class="btn btn-primary" disabled>✅ Process Attendance</button>
            </div>
        </div>
        
        <!-- Status -->
        <div id="status" class="status info hidden">
            Ready to start
        </div>
        
        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <h3 id="total-recognitions">0</h3>
                <p>Total Recognitions</p>
            </div>
            <div class="stat-card">
                <h3 id="success-rate">0%</h3>
                <p>Success Rate</p>
            </div>
            <div class="stat-card">
                <h3 id="avg-confidence">0%</h3>
                <p>Avg Confidence</p>
            </div>
            <div class="stat-card">
                <h3 id="features-analyzed">0</h3>
                <p>Features Analyzed</p>
            </div>
        </div>
        
        <!-- Results will be inserted here by JavaScript -->
    </div>
    
    <!-- Scripts -->
    <script src="facenet_enhanced_integration.js"></script>
    <script>
        // Camera and UI management
        let video, canvas, ctx;
        let stream = null;
        let isProcessing = false;
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            // Set up event listeners
            document.getElementById('start-camera').addEventListener('click', startCamera);
            document.getElementById('stop-camera').addEventListener('click', stopCamera);
            document.getElementById('capture-photo').addEventListener('click', capturePhoto);
            document.getElementById('process-attendance').addEventListener('click', processAttendance);
            
            // Threshold slider
            const thresholdSlider = document.getElementById('threshold');
            const thresholdValue = document.getElementById('threshold-value');
            
            thresholdSlider.addEventListener('input', function() {
                const value = this.value;
                thresholdValue.textContent = value;
                faceNetEnhanced.setThreshold(parseFloat(value));
            });
            
            // Feature analysis checkbox
            document.getElementById('feature-analysis').addEventListener('change', function() {
                faceNetEnhanced.toggleFeatureAnalysis();
            });
            
            updateStats();
        });
        
        async function startCamera() {
            try {
                showStatus('Starting camera...', 'info');
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                
                document.getElementById('start-camera').disabled = true;
                document.getElementById('stop-camera').disabled = false;
                document.getElementById('capture-photo').disabled = false;
                document.getElementById('process-attendance').disabled = false;
                
                showStatus('Camera started successfully', 'success');
                
            } catch (error) {
                console.error('Error starting camera:', error);
                showStatus('Error starting camera: ' + error.message, 'error');
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                
                document.getElementById('start-camera').disabled = false;
                document.getElementById('stop-camera').disabled = true;
                document.getElementById('capture-photo').disabled = true;
                document.getElementById('process-attendance').disabled = true;
                
                showStatus('Camera stopped', 'info');
            }
        }
        
        function capturePhoto() {
            if (!video.videoWidth || !video.videoHeight) {
                showStatus('Camera not ready', 'error');
                return;
            }
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            showStatus('Photo captured successfully', 'success');
            
            // You can add photo preview or processing here
            console.log('Photo captured:', imageData.substring(0, 50) + '...');
        }
        
        async function processAttendance() {
            if (isProcessing) return;
            
            if (!video.videoWidth || !video.videoHeight) {
                showStatus('Camera not ready', 'error');
                return;
            }
            
            isProcessing = true;
            document.getElementById('process-attendance').disabled = true;
            document.getElementById('process-attendance').classList.add('loading');
            
            try {
                showStatus('Processing attendance with enhanced recognition...', 'info');
                
                // Capture current frame
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                // Process with enhanced FaceNet
                const result = await faceNetEnhanced.processEnhancedAttendance(imageData);
                
                if (result && result.recognized) {
                    showStatus(`Attendance processed for ${result.nama}`, 'success');
                } else {
                    showStatus('Face not recognized', 'error');
                }
                
                updateStats();
                
            } catch (error) {
                console.error('Error processing attendance:', error);
                showStatus('Error processing attendance: ' + error.message, 'error');
            } finally {
                isProcessing = false;
                document.getElementById('process-attendance').disabled = false;
                document.getElementById('process-attendance').classList.remove('loading');
            }
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                status.classList.add('hidden');
            }, 5000);
        }
        
        function updateStats() {
            const stats = faceNetEnhanced.getRecognitionStats();
            
            document.getElementById('total-recognitions').textContent = stats.total;
            document.getElementById('success-rate').textContent = stats.successRate + '%';
            
            // Calculate average confidence
            let totalConfidence = 0;
            let confidenceCount = 0;
            
            faceNetEnhanced.recognitionHistory.forEach(entry => {
                if (entry.recognized && entry.data.confidence) {
                    totalConfidence += entry.data.confidence;
                    confidenceCount++;
                }
            });
            
            const avgConfidence = confidenceCount > 0 ? (totalConfidence / confidenceCount * 100).toFixed(1) : 0;
            document.getElementById('avg-confidence').textContent = avgConfidence + '%';
            
            // Count features analyzed
            let totalFeatures = 0;
            faceNetEnhanced.recognitionHistory.forEach(entry => {
                if (entry.data.feature_analysis && entry.data.feature_analysis.feature_vector) {
                    totalFeatures += entry.data.feature_analysis.feature_vector.length;
                }
            });
            
            document.getElementById('features-analyzed').textContent = totalFeatures;
        }
        
        // Global functions for attendance actions
        function processAttendance(nim, nama) {
            // Implement attendance processing logic
            console.log('Processing attendance for:', nim, nama);
            showStatus(`Attendance marked for ${nama}`, 'success');
        }
        
        function viewUserProfile(nim) {
            // Implement user profile viewing
            console.log('Viewing profile for:', nim);
            showStatus(`Opening profile for ${nim}`, 'info');
        }
        
        function updateFaceData(nim) {
            // Implement face data update
            console.log('Updating face data for:', nim);
            showStatus(`Updating face data for ${nim}`, 'info');
        }
    </script>
</body>
</html>
